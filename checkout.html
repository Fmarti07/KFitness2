<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFitness - Checkout</title>
  <link rel="stylesheet" href="css/estilos.css?v=20261112-5">
  <link rel="stylesheet" href="css/responsive.css?v=20261112-5">
  <link rel="stylesheet" href="css/compra-contacto.css?v=20261112-5">
</head>
<body>
  <header class="site-header" aria-label="Encabezado del sitio"></header>
  <main class="kf-gimnasio">
    <section id="checkout-cliente" class="kf-contenedor" aria-labelledby="checkout-titulo">
      <div class="checkout-encabezado">
        <h1 id="checkout-titulo">Finalizá tu reserva</h1>
        <span class="checkout-pruebas">Pago simulado</span>
      </div>
      <div class="checkout-layout">
        <section class="kf-panel checkout-panel" aria-labelledby="checkout-reserva-titulo">
          <h2 id="checkout-reserva-titulo">Tu reserva</h2>
          <div id="checkout-resumen" class="checkout-items"></div>
        </section>
        <section class="kf-panel checkout-panel" aria-labelledby="checkout-pago-titulo">
          <h2 id="checkout-pago-titulo">Resumen del pago</h2>
          <dl id="checkout-totales" class="checkout-datos"></dl>
          <div class="checkout-acciones checkout-acciones-pago">
            <button type="button" class="boton boton-principal" id="checkout-continuar" aria-controls="checkout-tarjeta" disabled>Continuar al pago</button>
            <button type="button" class="boton boton-principal" id="checkout-gratis" disabled hidden>Confirmar reserva gratuita</button>
            <button type="button" class="boton boton-secundario" id="checkout-ver-confirmacion" hidden>Ver confirmación</button>
          </div>
          <form id="checkout-tarjeta" class="checkout-tarjeta" autocomplete="off" aria-labelledby="checkout-tarjeta-titulo" hidden>
            <h3 id="checkout-tarjeta-titulo">Datos de la tarjeta</h3>
            <p>Usá solo datos ficticios.</p>
            <button type="button" id="checkout-datos-prueba" class="boton boton-secundario">Usar datos de prueba</button>
            <div class="kf-campos">
              <label class="kf-ancho">Nombre del titular<input id="checkout-titular" maxlength="60" required></label>
              <label class="kf-ancho">Número de tarjeta de prueba<input id="checkout-numero" inputmode="numeric" placeholder="4242 4242 4242 4242" pattern="4242424242424242|4242 4242 4242 4242" maxlength="19" required></label>
              <label>Vencimiento<input id="checkout-vencimiento" inputmode="numeric" placeholder="MM/AA" pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required></label>
              <label>CVV de prueba<input id="checkout-cvv" inputmode="numeric" placeholder="123" pattern="123" maxlength="3" required></label>
            </div>
            <div class="checkout-acciones checkout-acciones-pago">
              <button type="submit" class="boton boton-principal" id="checkout-pagar-aprobado" disabled>Simular pago</button>
              <button type="button" class="boton boton-secundario" id="checkout-pagar-rechazado" disabled>Simular rechazo</button>
            </div>
          </form>
          <p id="checkout-mensaje" class="mensaje-formulario" aria-live="polite"></p>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer" aria-label="Pie de página"></footer>
  <dialog id="checkout-confirmacion" aria-labelledby="checkout-confirmacion-titulo">
    <form method="dialog" class="checkout-confirmacion-encabezado">
      <span class="checkout-aprobado" aria-hidden="true">✓</span>
      <button class="boton boton-secundario" type="submit" aria-label="Cerrar confirmación">×</button>
    </form>
    <h2 id="checkout-confirmacion-titulo">Orden confirmada</h2>
    <p class="checkout-confirmacion-nota">Servicio confirmado <strong id="checkout-confirmacion-servicio"></strong></p>
    <dl class="checkout-datos">
      <div><dt>Número de orden</dt><dd id="checkout-confirmacion-numero"></dd></div>
      <div><dt>Total pagado</dt><dd id="checkout-confirmacion-total"></dd></div>
      <div><dt>Pago</dt><dd id="checkout-confirmacion-modo"></dd></div>
    </dl>
    <form method="dialog" class="checkout-acciones checkout-confirmacion-acciones">
      <button type="submit" class="boton boton-secundario">Cerrar</button>
      <a class="boton boton-principal" href="perfil.html?seccion=perfil-reservas&amp;filtro=proximas#perfil-reservas">Ver mis reservas</a>
    </form>
  </dialog>
  <script src="js/carrito-store.js?v=20261111-3" defer></script>
  <script src="js/app.js?v=20261112-5" defer></script>
  <script src="js/checkout.js?v=20261112-5" defer></script>
  <script src="js/site-info.js?v=20261112-5" defer></script>
</body>
</html>
