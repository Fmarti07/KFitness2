
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFitness - Iniciar sesión</title>

    <link rel="stylesheet" href="css/estilos.css?v=20261112-5">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/responsive.css?v=20261112-5">
    <link rel="stylesheet" href="css/login-premium.css?v=20261112-5">
</head>

<body class="pagina-login-premium">

    <header class="site-header" aria-label="Encabezado del sitio"></header>

    <main>
        <section class="seccion login-principal login-premium"
                 aria-labelledby="login-titulo">

            <div class="login-premium-fondo" aria-hidden="true"></div>
            <div class="login-premium-overlay" aria-hidden="true"></div>

            <div class="contenedor formulario-centro login-premium-contenedor">

                <div class="tarjeta formulario-tarjeta login-premium-tarjeta">

                    <div class="login-premium-encabezado">
                        <img class="auth-logo login-premium-logo"
                             src="img/Logo1.png"
                             alt="KFitness">

                        <h1 id="login-titulo">Iniciar sesión</h1>

                        <p class="login-premium-subtitulo">
                            Bienvenido de nuevo. Accede a tu cuenta.
                        </p>
                    </div>

                    <form id="form-login" class="formulario login-premium-formulario" novalidate>

                        <label for="login-email">Correo electrónico</label>

                        <div class="login-premium-campo">
                            <span class="login-premium-icono" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                    <path d="m3 7 9 6 9-6"></path>
                                </svg>
                            </span>

                            <input type="email"
                                   id="login-email"
                                   name="email"
                                   placeholder="Ingresa tu correo electrónico"
                                   autocomplete="email"
                                   required>
                        </div>

                        <label for="login-password">Contraseña</label>

                        <div class="login-premium-campo">
                            <span class="login-premium-icono" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                            </span>

                            <input type="password"
                                   id="login-password"
                                   name="password"
                                   placeholder="Ingresa tu contraseña"
                                   autocomplete="current-password"
                                   required>

                            <button type="button"
                                    id="login-ver-password"
                                    class="login-premium-ver"
                                    aria-label="Mostrar contraseña"
                                    aria-pressed="false">

                                <svg viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8"
                                     stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>

                        <div class="fila-check login-premium-opciones">
                            <label class="login-premium-recordarme">
                                <input type="checkbox"
                                       id="login-recordarme"
                                       name="recordarme">
                                <span>Recordarme</span>
                            </label>

                            <a href="recuperar-contrasena.html">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <button type="submit"
                                class="boton boton-principal login-premium-boton">
                            <span class="login-premium-boton-texto">INICIAR SESIÓN</span>
                            <span class="login-premium-boton-flecha" aria-hidden="true">→</span>
                            <span class="login-premium-spinner" aria-hidden="true"></span>
                        </button>

                        <p class="mensaje-formulario"
                           id="login-mensaje"
                           aria-live="polite"></p>

                        <div class="login-premium-separador"></div>

                        <p class="texto-ayuda login-premium-registro">
                            ¿No tienes una cuenta?
                            <a href="registro.html">Regístrate</a>
                        </p>

                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" aria-label="Pie de página"></footer>

    <script src="js/app.js?v=20261112-5" defer></script>
    <script src="js/autenticacion.js?v=20261001-1" defer></script>
    <script src="js/login-premium.js" defer></script>

</body>
</html>
